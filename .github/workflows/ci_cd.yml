name: CI/CD

on:
 push:
   branches:
    - main
 pull_request:
   branches:
     - main

permissions:
 contents: read

jobs:
  vulnerability-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
         fetch-depth: 0

      - name: Installer unzip
        run: |
           sudo apt-get update
           sudo apt-get install -y unzip
      - name: Analyse Sonarqube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          scannerVersion: 6.2.0.4584
        env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build project
    runs-on: ubuntu-24.04
    needs: vulnerability-scan

    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build du projet
        run: npm run build

      - name: Sauvegarde du dossier dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vue-dist
          path: dist/

  trivy:
    name: SCA - Trivy
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: |
          docker build -t vuejs-app:${{ github.sha }} .

      - name: Analyse de l'image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vuejs-app:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Déploiement
    runs-on: self-hosted
    needs: trivy

    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Construction de l'image Docker
        run: |
          docker build -t vuejs-app:${{ github.sha }} .

      - name: Déploiement
        run: |
          docker run -d \
            --name vuejs-app \
            -p 8080:80 \
            vuejs-app:${{ github.sha }} .

      - name: Vérification
        run: |
          sleep 5
          curl -f http://localhost:8080

  zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04
    needs: deploy

    steps:
      - name: Scan OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'

